<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WxCC Oracle Widget</title>
  </head>
  <body style="margin:0;overflow:hidden;">
    <div id="root"></div>
    <script>
      // Standalone dev only: real WxCC Desktop injects window.AGENTX_SERVICE
      // before this page's scripts run. When it's missing (e.g. opened
      // directly during `npm run dev`), load a mock so @wxcc-desktop/sdk
      // doesn't throw at import time. No-op inside a real deployment.
      if (!window.AGENTX_SERVICE) {
        document.write('<script src="/agentx-mock.js"><\/script>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
